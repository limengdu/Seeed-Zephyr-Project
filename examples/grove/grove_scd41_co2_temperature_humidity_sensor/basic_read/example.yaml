id: grove_scd41_basic_read
kind: grove
module_id: grove_scd41_co2_temperature_humidity_sensor
demo: basic_read
interface: i2c
connector: xiao
pin_policy: fixed-bus
# xiao_ra4m1 has no xiao_i2c connector label in its upstream Zephyr devicetree.
# xiao_ra4m1 的上游 Zephyr 设备树没有 xiao_i2c connector 标签。
excluded_boards:
  - xiao_ra4m1
expected_behavior: Prints CO2 (ppm), temperature (C), and relative humidity (%) every five seconds.
