CONFIG_GPIO=y
CONFIG_PRINTK=y
CONFIG_UART_LINE_CTRL=y

# USB identity of the XIAO STM32C5 application (2886:00C5).
# XIAO STM32C5 应用程序的 USB 标识（2886:00C5）。
CONFIG_CDC_ACM_SERIAL_VID=0x2886
CONFIG_CDC_ACM_SERIAL_PID=0x00C5
CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="Seeed Studio"
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="XIAO STM32C5"

# TinyUF2 image for the factory bootloader (family id 0x00C5C5C5).
# 面向出厂引导程序的 TinyUF2 镜像（family id 0x00C5C5C5）。
CONFIG_BUILD_OUTPUT_UF2=y
CONFIG_BUILD_OUTPUT_UF2_FAMILY_ID="0x00C5C5C5"
