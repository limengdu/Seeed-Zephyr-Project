CONFIG_GPIO=y
CONFIG_PRINTK=y
CONFIG_UART_LINE_CTRL=y
CONFIG_REBOOT=y
CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y

# USB identity of the XIAO nRF54LM20B application (2886:8013).
# XIAO nRF54LM20B 应用程序的 USB 标识（2886:8013）。
CONFIG_CDC_ACM_SERIAL_VID=0x2886
CONFIG_CDC_ACM_SERIAL_PID=0x8013
CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="Seeed Studio"
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="XIAO nRF54LM20B"

# Signs the image for the factory MCUboot firmware loader.
# 为出厂 MCUboot 固件加载器签名镜像。
CONFIG_MCUBOOT_BOOTLOADER_MODE_FIRMWARE_UPDATER=y
CONFIG_MCUBOOT_BOOTLOADER_SIGNATURE_TYPE_PURE=y
CONFIG_MCUBOOT_GENERATE_CONFIRMED_IMAGE=y
CONFIG_MCUBOOT_SIGNATURE_KEY_FILE="bootloader/mcuboot/root-ed25519.pem"
