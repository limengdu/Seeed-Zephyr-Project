name: Release VS Code extension

# Publishes the VS Code extension automatically when the version in package.json
# changes on main. The version number is the release trigger: if that version is
# already on Open VSX the run skips publishing, otherwise it packages one .vsix
# and publishes it to every registry whose token secret is set. A missing token
# skips that registry instead of failing the run. Can also be run manually from
# the Actions tab.
on:
  push:
    branches: [main]
    paths:
      - 'tools/vscode-extension/**'
      - '.github/workflows/release-vscode.yml'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    defaults:
      run:
        working-directory: tools/vscode-extension
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Reads package.json version and asks Open VSX whether it is already
      # published, using it as the source of truth for "have we released this".
      - name: Determine whether this version needs publishing
        id: check
        run: |
          version="$(node -p "require('./package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          status="$(curl -sS -o /dev/null -w '%{http_code}' "https://open-vsx.org/api/seeed-studio/seeed-xiao-zephyr-assistant/${version}" || true)"
          if [ "$status" = "200" ]; then
            echo "new_version=false" >> "$GITHUB_OUTPUT"
            echo "Extension ${version} is already on Open VSX; nothing to publish."
          else
            echo "new_version=true" >> "$GITHUB_OUTPUT"
            echo "Extension ${version} is not on Open VSX; packaging and publishing."
          fi

      - name: Install dependencies
        if: steps.check.outputs.new_version == 'true'
        run: npm ci

      # Build one .vsix and reuse it for every registry below.
      - name: Package extension
        if: steps.check.outputs.new_version == 'true'
        run: npx --yes @vscode/vsce package -o extension.vsix

      - name: Publish to VS Code Marketplace
        if: steps.check.outputs.new_version == 'true' && env.VSCE_PAT != ''
        run: npx --yes @vscode/vsce publish --packagePath extension.vsix --pat "$VSCE_PAT"

      - name: Publish to Open VSX
        if: steps.check.outputs.new_version == 'true' && env.OVSX_PAT != ''
        run: npx --yes ovsx publish extension.vsix --pat "$OVSX_PAT"
