name: Metadata Validation

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: python -m pip install -r tools/validate_metadata/requirements.txt

      - name: Run metadata validator
        run: python tools/validate_metadata/validate.py
