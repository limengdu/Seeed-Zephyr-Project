# Authored board metadata (product layer). Derived status lives in metadata/status/.
id: xiao_samd21
display_name: Seeed Studio XIAO SAMD21
zephyr_target: seeeduino_xiao
vendor: microchip
soc: samd21
form_factor: xiao
also_known_as:
  - Seeeduino XIAO
version_policy: latest_stable
# Console uses sercom4, which is the xiao_serial bus on D6/D7.
# 控制台使用 sercom4，即 D6/D7 上的 xiao_serial 总线。
reserved_pins:
  - pin: D6
    reason: console-uart
  - pin: D7
    reason: console-uart
# All eleven D0-D10 pads are analog-capable on SAMD21.
# SAMD21 上 D0-D10 全部具备模拟输入能力。
analog_pins:
  - D0
  - D1
  - D2
  - D3
  - D4
  - D5
  - D6
  - D7
  - D8
  - D9
  - D10

# Provisional baseline derived from the upstream Zephyr connector dtsi.
# Replace with official Seeed schematic values and update pin_map_source to the Wiki URL.
# 过渡基线,派生自上游 Zephyr connector dtsi。
# 请以 Seeed 官方原理图为准替换,并将 pin_map_source 更新为 Wiki 链接。
pin_map_source: zephyr/boards/seeed/seeeduino_xiao/seeed_xiao_connector.dtsi
pin_map:
  - pin: D0
    chip_pin: porta.2
  - pin: D1
    chip_pin: porta.4
  - pin: D2
    chip_pin: porta.10
  - pin: D3
    chip_pin: porta.11
  - pin: D4
    chip_pin: porta.8
  - pin: D5
    chip_pin: porta.9
  - pin: D6
    chip_pin: portb.8
  - pin: D7
    chip_pin: portb.9
  - pin: D8
    chip_pin: porta.7
  - pin: D9
    chip_pin: porta.5
  - pin: D10
    chip_pin: porta.6
