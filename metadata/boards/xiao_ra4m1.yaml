# Authored board metadata (product layer). Derived status lives in metadata/status/.
id: xiao_ra4m1
display_name: Seeed Studio XIAO RA4M1
zephyr_target: xiao_ra4m1
vendor: renesas
soc: ra4m1
form_factor: xiao
also_known_as: []
version_policy: latest_stable
# Console uses uart0, which is the xiao_serial bus on D6/D7.
# 控制台使用 uart0，即 D6/D7 上的 xiao_serial 总线。
reserved_pins:
  - pin: D6
    reason: console-uart
  - pin: D7
    reason: console-uart
analog_pins: []

