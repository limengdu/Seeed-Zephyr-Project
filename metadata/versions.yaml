# Release pairs: each seeed-zephyr release pins one Zephyr version and SDK.
# 发布版本对：每个 seeed-zephyr 版本锁定一个 Zephyr 版本和 SDK 版本。
#
# version: seeed-zephyr package version; the repository tag is v<version>.
# zephyr:  Zephyr tag the release examples are validated against.
# sdk:     Zephyr SDK version used to build them.
# The first entry is the newest release and matches the current repository.
releases:
  - version: 0.5.4
    zephyr: v4.5.0
    sdk: 1.0.1
  - version: 0.5.3
    zephyr: v4.5.0
    sdk: 1.0.1
  - version: 0.5.2
    zephyr: v4.5.0
    sdk: 1.0.1
  - version: 0.5.1
    zephyr: v4.5.0
    sdk: 1.0.1
  - version: 0.5.0
    zephyr: v4.5.0
    sdk: 1.0.1
  - version: 0.4.0
    zephyr: v4.4.0
    sdk: 1.0.1
